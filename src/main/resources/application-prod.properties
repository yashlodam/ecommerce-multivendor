# ==========================================
# SHOPSPHERE — PRODUCTION PROFILE
# ==========================================
# All values can be supplied via environment variables in production.
# Render automatically supplies PORT and DATABASE_URL.

# Server
server.address=0.0.0.0
spring.datasource.url=${DATABASE_URL:${DB_URL}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
# 'update' ensures tables and columns are created/migrated automatically on fresh deployment.
# Can be overridden with DDL_AUTO=validate if manual migrations are introduced.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator — expose health endpoint for Render health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.mail.enabled=false

# Logging
logging.level.com.zosh=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.root=WARN

# Security & Secrets (Required in production)
app.jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY}}

# Third-Party Integrations (Optional at initial launch)
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${RESEND_FROM_EMAIL:ShopSphere <onboarding@resend.dev>}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.api-key=${GEMINI_API_KEY:}
