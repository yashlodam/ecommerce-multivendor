spring.application.name=ecommerce_multivendor

# ==========================================
# SERVER CONFIGURATION
# Render sets the PORT environment variable dynamically.
# Falls back to SERVER_PORT or local default 5454.
# ==========================================
server.port=${PORT:${SERVER_PORT:5454}}
server.address=0.0.0.0

# ==========================================
# DATABASE CONFIGURATION
# Render provides DATABASE_URL (postgres://... or postgresql://...).
# DatabaseConfig.java automatically converts Render URIs to standard JDBC URLs.
# For local development, DB_URL / DB_USERNAME / DB_PASSWORD can be set via .env.
# ==========================================
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_multivendor}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Tuned for cloud / starter-tier databases)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION:60000}

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# 'update' automatically creates and updates tables/columns on deployment.
# Can be changed to 'validate' or 'none' via DDL_AUTO env var.
# NEVER use 'create' or 'create-drop' in production.
# ==========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# JWT AUTHENTICATION CONFIGURATION
# CRITICAL: Supply JWT_SECRET or JWT_SECRET_KEY in production (min 64 chars).
# Never commit real secrets to source control.
# ==========================================
app.jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:ShopSphereDefaultSecretKeyForTokenSigningInDevelopmentAndStagingOnlyMustBeLongEnough64Bytes}}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:86400000}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.jwt.cookie-secure=${COOKIE_SECURE:true}
app.jwt.cookie-same-site=${COOKIE_SAME_SITE:None}

# ==========================================
# CORS & FRONTEND CONFIGURATION
# Allowed origins for frontend clients (e.g. your Render or Vercel frontend URL).
# Comma-separated list supported.
# ==========================================
app.cors.allowed-origins=${FRONTEND_URL:${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}}
app.payment.callback-base-url=${PAYMENT_CALLBACK_BASE_URL:${FRONTEND_URL:http://localhost:5173}}

# ==========================================
# EMAIL DELIVERY CONFIGURATION (BREVO HTTPS API)
# Render Free Tier blocks outbound SMTP ports (25, 465, 587).
# All emails are dispatched over HTTPS (port 443) via Brevo Transactional Email API.
# Endpoint: POST https://api.brevo.com/v3/smtp/email
# Set BREVO_API_KEY, BREVO_FROM_EMAIL, and BREVO_FROM_NAME in Render Environment Variables.
# ==========================================
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.from-email=${BREVO_FROM_EMAIL:noreply@shopsphere.com}
app.email.brevo.from-name=${BREVO_FROM_NAME:ShopSphere}

# ==========================================
# PAYMENT GATEWAY — RAZORPAY
# Supply RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET via environment variables.
# ==========================================
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ==========================================
# APPLICATION & ADMIN SEED CONFIGURATION
# If ADMIN_EMAIL and ADMIN_PASSWORD are provided, an initial admin
# user is created on first startup if not already present.
# ==========================================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:ShopSphere Admin}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# ==========================================
# ACTUATOR & HEALTH MONITORING
# Health checks for Render zero-downtime deploys and restart probes.
# Health endpoint: /actuator/health
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.com.zosh=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# AI SHOPPING ASSISTANT CONFIGURATION
# API keys must be provided via environment variables.
# ==========================================
# Groq API
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.ai.groq.max-tokens=${GROQ_MAX_TOKENS:1024}
app.ai.groq.temperature=${GROQ_TEMPERATURE:0.5}

# Gemini API (Alternative LLM Provider)
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.max-tokens=${GEMINI_MAX_TOKENS:1024}
app.ai.temperature=${GEMINI_TEMPERATURE:0.7}

# AI Rate Limiting (Requests per minute per user/IP)
app.ai.rate-limit-per-minute=${AI_RATE_LIMIT:60}

